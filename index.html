<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌍 Car Parking Script - World's Best Menu</title>
    <style>
        /* ===== グローバルスタイル ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: #0a0e27;
            color: #fff;
            overflow: hidden;
        }

        /* ===== メインコンテナ ===== */
        #page-container {
            position: fixed;
            right: 5px;
            top: 5px;
            z-index: 10000;
            transform: scale(0.75);
            transform-origin: top right;
            transition: transform 0.2s ease;
            max-width: 400px;
            background: rgba(10, 14, 39, 0.95);
            border-radius: 12px;
            border: 2px solid #1a6dd6;
            box-shadow: 0 8px 32px rgba(26, 109, 214, 0.3);
            padding: 10px;
        }

        /* ===== ページコンテナ ===== */
        #page1-container, #page2-container, #page3-container, #page4-container, #page5-container {
            display: flex;
            flex-direction: column;
            padding: 0;
            margin: 0;
            max-height: 600px;
            overflow-y: auto;
        }

        #page2-container, #page3-container, #page4-container, #page5-container {
            display: none;
        }

        /* ===== ページ切り替えボタン ===== */
        #page-switch-container {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #1a1f3a 0%, #0f2454 100%);
            padding: 8px;
            border-radius: 8px;
        }

        #page-switch-container button {
            flex: 1;
            min-width: 50px;
            padding: 6px 8px;
            font-size: 11px;
            font-weight: 700;
            border: 2px solid #1a6dd6;
            background: #0f2454;
            color: #fff;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        #page-switch-container button:hover {
            background: #1a6dd6;
            box-shadow: 0 4px 15px rgba(26, 109, 214, 0.5);
        }

        #page-switch-container button:disabled {
            background: #1a6dd6;
            border-color: #00d4ff;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        /* ===== 行スタイル ===== */
        #page1-container > div, 
        #page2-container > div,
        #page3-container > div.page-row,
        #page4-container > div.page-row,
        #page5-container > div.page-row {
            background: linear-gradient(135deg, rgba(26, 109, 214, 0.1) 0%, rgba(0, 212, 255, 0.05) 100%);
            border: 1px solid rgba(26, 109, 214, 0.3);
            padding: 8px 10px;
            margin-bottom: 5px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 5px;
            user-select: none;
            transition: all 0.3s ease;
        }

        #page1-container > div:hover,
        #page2-container > div:hover,
        #page3-container > div.page-row:hover,
        #page4-container > div.page-row:hover,
        #page5-container > div.page-row:hover {
            background: linear-gradient(135deg, rgba(26, 109, 214, 0.2) 0%, rgba(0, 212, 255, 0.1) 100%);
            border-color: rgba(0, 212, 255, 0.5);
            box-shadow: 0 4px 12px rgba(26, 109, 214, 0.3);
        }

        /* ===== ラベルスタイル ===== */
        #slider-label, #rotation-label {
            color: #00d4ff;
            font-weight: 700;
            font-size: 10px;
            white-space: nowrap;
            text-shadow: 0 0 5px rgba(0, 212, 255, 0.5);
        }

        #zoom-container #zoom-value,
        #extra-rotation-value {
            color: #00d4ff;
            font-weight: 700;
            font-size: 10px;
            margin-left: 5px;
            white-space: nowrap;
            text-shadow: 0 0 5px rgba(0, 212, 255, 0.5);
        }

        /* ===== スライダースタイル ===== */
        input[type=range] {
            -webkit-appearance: none;
            width: 70px;
            height: 4px;
            background: linear-gradient(90deg, #1a6dd6, #00d4ff);
            border-radius: 5px;
            outline: 0;
            cursor: pointer;
            margin: 0 3px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00d4ff;
            border: 2px solid #1a6dd6;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 212, 255, 0.6);
        }

        /* ===== ボタンスタイル ===== */
        button {
            padding: 6px 10px;
            border: 2px solid #1a6dd6;
            border-radius: 5px;
            background: linear-gradient(135deg, #1a6dd6 0%, #0f2454 100%);
            color: #fff;
            font-weight: 700;
            font-size: 9px;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s ease;
            white-space: nowrap;
            margin-left: 3px;
        }

        button:hover:not(:disabled) {
            background: linear-gradient(135deg, #00d4ff 0%, #1a6dd6 100%);
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
            border-color: #00d4ff;
        }

        button:disabled {
            background: linear-gradient(135deg, #555 0%, #333 100%);
            border-color: #888;
            cursor: default;
            opacity: 0.6;
        }

        #zoom-container button {
            font-size: 14px;
            font-weight: 900;
            width: 30px;
            padding: 4px;
        }

        /* ===== トグルスイッチ ===== */
        .switch-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            margin-left: auto;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 45px;
            height: 25px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider-toggle {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #1a6dd6, #0f2454);
            transition: 0.4s;
            border-radius: 25px;
            border: 2px solid #1a6dd6;
        }

        .slider-toggle:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 2px;
            bottom: 2px;
            background: #00d4ff;
            transition: 0.4s;
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(0, 212, 255, 0.6);
        }

        input:checked + .slider-toggle {
            background: linear-gradient(135deg, #00d4ff, #1a6dd6);
        }

        input:checked + .slider-toggle:before {
            transform: translateX(18px);
        }

        /* ===== メモ帳 ===== */
        #memo-display-area {
            background: linear-gradient(135deg, rgba(26, 109, 214, 0.1) 0%, rgba(0, 212, 255, 0.05) 100%);
            border: 1px solid rgba(26, 109, 214, 0.3);
            padding: 8px;
            border-radius: 6px;
            max-height: 200px;
            overflow-y: auto;
            color: #dcdcdc;
            font-size: 10px;
            line-height: 1.4;
            user-select: text;
            margin-top: 5px;
            margin-bottom: 3px;
        }

        .memo-item {
            padding: 4px 0;
            border-bottom: 1px dotted rgba(0, 212, 255, 0.3);
            word-wrap: break-word;
            color: #00d4ff;
        }

        .memo-item:last-child {
            border-bottom: none;
        }

        /* ===== 座標移動パッド ===== */
        .directional-pad {
            display: inline-block;
            padding: 4px;
        }

        .dir-row {
            display: flex;
            justify-content: center;
            gap: 2px;
        }

        .dir-btn {
            width: 24px;
            height: 20px;
            padding: 0 !important;
            margin: 1px !important;
            font-size: 8px !important;
        }

        .dir-placeholder {
            width: 24px;
            height: 20px;
            margin: 1px;
        }

        .vertical-controls {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-left: 5px;
        }

        .vertical-controls button {
            width: 28px;
            height: 22px;
            padding: 0 !important;
            margin: 0 !important;
            font-size: 10px !important;
        }

        /* ===== スクロールバー ===== */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(26, 109, 214, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #1a6dd6, #00d4ff);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #00d4ff, #1a6dd6);
        }

        /* ===== ページ5: ランク機能 ===== */
        #page5-container {
            width: 100% !important;
        }

        #page5-container input {
            width: 100%;
            background: rgba(15, 36, 84, 0.5);
            border: 2px solid #1a6dd6;
            padding: 8px;
            color: #00d4ff;
            font-size: 11px;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 5px;
        }

        #page5-container input::placeholder {
            color: rgba(0, 212, 255, 0.3);
        }

        #page5-status {
            font-size: 10px;
            text-align: center;
            min-height: 20px;
            color: #888;
            margin-top: 5px;
        }

        #page5-status.status-success {
            color: #00ff00 !important;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }

        #page5-status.status-error {
            color: #ff3333 !important;
            text-shadow: 0 0 5px rgba(255, 51, 51, 0.5);
        }
    </style>
</head>

<script>
// ==================== h5gg ダミー ====================
if (typeof h5gg === 'undefined') {
    window['h5gg'] = {
        'toast': (msg) => console.log('🔔', msg),
        'clearResults': () => console.log('🗑️ Clear'),
        'searchNumber': (v, t, s, e) => console.log(`🔍 Search: ${v} (${t})`),
        'searchNearby': (v, t, r) => console.log(`🎯 Nearby: ${v} (${t})`),
        'editAll': (v, t) => console.log(`✏️ Edit: ${v} (${t})`),
        'getResults': (c) => [{address: '0x12345678'}, {address: '0x12345680'}],
        'getResultsCount': () => 2,
        'getValue': (a, t) => Math.floor(Math.random() * 1000).toString(),
        'setValue': (a, v, t) => console.log(`📝 Set: ${a} = ${v} (${t})`),
        'prompt': (t, m, ty, d) => window.prompt(m, d)
    };
}

// ==================== ズーム機能 ====================
const pageContainer = document.getElementById('page-container');
const zoomInBtn = document.getElementById('zoom-in-btn');
const zoomOutBtn = document.getElementById('zoom-out-btn');
const zoomValueDisplay = document.getElementById('zoom-value');
let currentZoom = 0.75;
const ZOOM_STEP = 0.1;
const MIN_ZOOM = 0.4;
const MAX_ZOOM = 2;

function updateZoomDisplay() {
    pageContainer.style.transform = 'scale(' + currentZoom.toFixed(2) + ')';
    zoomValueDisplay.textContent = Math.round(currentZoom * 100) + '%';
}

zoomInBtn.addEventListener('click', () => {
    if (currentZoom < MAX_ZOOM) {
        currentZoom += ZOOM_STEP;
        updateZoomDisplay();
    }
});

zoomOutBtn.addEventListener('click', () => {
    if (currentZoom > MIN_ZOOM) {
        currentZoom -= ZOOM_STEP;
        updateZoomDisplay();
    }
});

updateZoomDisplay();

// ==================== ページ切り替え ====================
const page1 = document.getElementById('page1-container');
const page2 = document.getElementById('page2-container');
const page3 = document.getElementById('page3-container');
const page4 = document.getElementById('page4-container');
const page5 = document.getElementById('page5-container');

function showPage(n) {
    page1.style.display = page2.style.display = page3.style.display = page4.style.display = page5.style.display = 'none';
    document.querySelectorAll('#page-switch-container button').forEach(b => b.disabled = false);
    
    const pages = [page1, page2, page3, page4, page5];
    const btns = document.querySelectorAll('#page-switch-container button');
    
    if (pages[n - 1]) {
        pages[n - 1].style.display = 'flex';
        if (btns[n - 1]) btns[n - 1].disabled = true;
    }
}

document.getElementById('show-page1-btn').addEventListener('click', () => showPage(1));
document.getElementById('show-page2-btn').addEventListener('click', () => showPage(2));
document.getElementById('show-page3-btn').addEventListener('click', () => showPage(3));
document.getElementById('show-page4-btn').addEventListener('click', () => showPage(4));
document.getElementById('show-page5-btn').addEventListener('click', () => showPage(5));

showPage(1);

// ==================== PAGE 1: 詳細調整 ====================

const slider = document.getElementById('slider');
const searchBtn = document.getElementById('search-btn');
const gravityResetBtn = document.getElementById('gravity-reset-btn');
const rotationSlider = document.getElementById('rotation-slider');
const rotationSearchBtn = document.getElementById('rotation-search-btn');
const rotationResetBtn = document.getElementById('rotation-reset-btn');
const extraRotationSlider = document.getElementById('extra-rotation-slider');
const extraRotationSearchBtn = document.getElementById('extra-rotation-search-btn');
const extraRotationResetBtn = document.getElementById('extra-rotation-reset-btn');
const wallhackOnBtn = document.getElementById('wallhack-on-btn');
const wallhackOffBtn = document.getElementById('wallhack-off-btn');
const clearBtn = document.getElementById('clear-btn');
const rileruOnBtn = document.getElementById('rileru-on-btn');
const rileruOffBtn = document.getElementById('rileru-off-btn');
const gettanBtn = document.getElementById('gettan-btn');
const fixedEditBtn = document.getElementById('fixed-edit-btn');
const jumpBtn = document.getElementById('jump-btn');
const fallBtn = document.getElementById('fall-btn');
const chatLimitBtn = document.getElementById('chat-limit-btn');
const humanTransparencyToggle = document.getElementById('human-transparency-toggle');
const extraRotationValueDisplay = document.getElementById('extra-rotation-value');
const extraRotationUpBtn = document.getElementById('extra-rotation-up-btn');
const extraRotationDownBtn = document.getElementById('extra-rotation-down-btn');

let searchDone = false, rotationSearchDone = false, extraRotationSearchDone = false, isEditing = false;

const initialValue = -10;
const initialSearchValue = -9.8;
const initialRotationValue = 0;
const initialRotationSearchValue = -8.5;
const initialExtraRotationValue = -80;
const initialExtraRotationSearchValue = -80;

function updateExtraRotationValueDisplay() {
    extraRotationValueDisplay.textContent = extraRotationSlider.value;
}

updateExtraRotationValueDisplay();

async function handleSearchClick(btn, done, val, name) {
    if (done) {
        h5gg.toast?.(name + ' 済み✓');
        return done;
    }
    btn.disabled = true;
    h5gg.toast?.(`🔍 ${name} 検索中...`);
    try {
        await h5gg.searchNumber(val.toString(), 'F32', '0x0', '0x200000000');
        h5gg.toast?.(`✓ ${name} 完了`);
        return true;
    } catch (e) {
        h5gg.toast?.(`✗ ${name} エラー`);

    d.classList.add('memo-item');
    d.textContent = t;

    memoInput.value = '';
    memoInput.focus();
}

// ==================== PAGE 4: 座標移動 ====================

let holdInterval = null;
let N1value = 0, W1value = 0, U1value = 22;
let baseResults = [];
let storedX = 0, storedY = 0, storedZ = 0, isCoordSaved = false;
const moveStep = 1;

function startHold(func) {
    if (holdInterval) return;
    holdInterval = setInterval(func, 20);
}

function stopHold() {
    clearInterval(holdInterval);
    holdInterval = null;
}

function initSearch() {
    h5gg.clearResults();
    h5gg.searchNumber('8403089831969947648', 'I64', '0x0', '0x300000000');
    baseResults = h5gg.getResults(h5gg.getResultsCount());
    h5gg.clearResults();
    if (baseResults.length > 0) {
        W1value = Number(h5gg.getValue(Number(baseResults[0].address) + 0x60, 'F32'));
        U1value = Number(h5gg.getValue(Number(baseResults[0].address) + 0x64, 'F32'));
        N1value = Number(h5gg.getValue(Number(baseResults[0].address) + 0x68, 'F32'));
        document.getElementById('initButton').style.backgroundColor = '#00d4ff';
        h5gg.toast?.('✓ 座標取得');
    }
}

function storeAndTeleport() {
    if (!baseResults.length) {
        h5gg.toast?.('先にONを押してください');
        return;
    }
    if (!isCoordSaved) {
        W1value = Number(h5gg.getValue(Number(baseResults[0].address) + 0x60, 'F32'));
        U1value = Number(h5gg.getValue(Number(baseResults[0].address) + 0x64, 'F32'));
        N1value = Number(h5gg.getValue(Number(baseResults[0].address) + 0x68, 'F32'));
        storedX = W1value;
        storedY = U1value;
        storedZ = N1value;
        isCoordSaved = true;
        document.getElementById('coordButton').innerText = 'TP';
        h5gg.toast?.('💾 座標保存');
    } else {
        W1value = storedX;
        U1value = storedY;
        N1value = storedZ;
        for (const r of baseResults) {
            h5gg.setValue(Number(r.address) + 0x60, W1value, 'F32');
            h5gg.setValue(Number(r.address) + 0x64, U1value, 'F32');
            h5gg.setValue(Number(r.address) + 0x68, N1value, 'F32');
        }
        h5gg.toast?.('📍 テレポート');
    }
}

function N1() { N1value += moveStep; for (const r of baseResults) h5gg.setValue(Number(r.address) + 0x68, N1value, 'F32'); }
function S1() { N1value -= moveStep; for (const r of baseResults) h5gg.setValue(Number(r.address) + 0x68, N1value, 'F32'); }
function E1() { W1value += moveStep; for (const r of baseResults) h5gg.setValue(Number(r.address) + 0x60, W1value, 'F32'); }
function W1() { W1value -= moveStep; for (const r of baseResults) h5gg.setValue(Number(r.address) + 0x60, W1value, 'F32'); }
function U1() { U1value += moveStep; for (const r of baseResults) h5gg.setValue(Number(r.address) + 0x64, U1value, 'F32'); }
function D1() { U1value -= moveStep; for (const r of baseResults) h5gg.setValue(Number(r.address) + 0x64, U1value, 'F32'); }

// ==================== PAGE 5: ランク ====================

let currentUser = null, currentToken = null;

function updateStatus(msg, type = 'normal') {
    const el = document.getElementById('page5-status');
    el.textContent = msg;
    el.className = 'status-' + type;
}

async function loginFirebase() {
    const e = document.getElementById('email').value.trim();
    const p = document.getElementById('password').value;
    if (!e || !p) {
        updateStatus('メールとパスワードを入力', 'error');
        return;
    }
    updateStatus('ログイン中...');
    try {
        const r = await fetch('https://www.googleapis.com/identitytoolkit/v3/relyingparty/verifyPassword?key=AIzaSyBW1ZrRgrQGPTMkeqZjUbzuVbMiUeDZHYU', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: e, password: p, returnSecureToken: true })
        });
        const j = await r.json();
        if (j.idToken) {
            currentToken = j.idToken;
            currentUser = e;
            updateStatus('ログイン成功: ' + e, 'success');
        } else {
            updateStatus('ログイン失敗', 'error');
        }
    } catch (e) {
        updateStatus('ネットワークエラー', 'error');
    }
}

async function kingRank() {
    if (!currentToken) {
        updateStatus('先にログインしてください', 'error');
        return;
    }
    updateStatus('KING設定中...');
    const data = {
        data: JSON.stringify({
            RatingData: {
                money: 999999,
                levels: 999999,
                coins: 999999
            },
            Rank: 1
        })
    };
    try {
        const r = await fetch('https://us-central1-cp-multiplayer.cloudfunctions.net/SetUserRank', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + currentToken, 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        if (r.ok) {
            updateStatus('✓ KING設定完了', 'success');
        } else {
            updateStatus('設定失敗', 'error');
        }
    } catch (e) {
        updateStatus('通信エラー', 'error');
    }
}
